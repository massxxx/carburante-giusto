name: App Android (APK)

# Costruisce l'app Android dai file del sito e la mette nella pagina Releases:
# https://github.com/massxxx/carburante-giusto/releases/latest/download/CarburanteGiusto.apk
# I prezzi l'app li scarica ogni volta dal repository, quindi non serve ricostruirla ogni giorno.
on:
  push:
    branches: [main]
    paths: ['index.html', 'leaflet.js', 'icone/**', 'base/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepara il progetto
        run: |
          mkdir -p app/www && cd app
          cp -r ../index.html ../leaflet.js ../manifest.webmanifest ../icone ../base ../dati www/
          cat > package.json <<'J'
          {"name":"carburante-giusto","version":"1.0.0","private":true}
          J
          cat > capacitor.config.json <<'J'
          {"appId":"it.massxxx.carburantegiusto","appName":"Carburante Giusto","webDir":"www","android":{"allowMixedContent":false}}
          J
          npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap add android
          npx cap sync android

      - name: Permessi, icona e versione
        run: |
          cd app/android
          M=app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' $M
          grep -q ACCESS_FINE_LOCATION $M
          rm -rf app/src/main/res/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            cp ../../icone/android/$n.png app/src/main/res/mipmap-$n/ic_launcher.png
            cp app/src/main/res/mipmap-$n/ic_launcher.png app/src/main/res/mipmap-$n/ic_launcher_round.png
            rm -f app/src/main/res/mipmap-$n/ic_launcher_foreground.png
          done
          N=${{ github.run_number }}
          sed -i "s/versionCode 1$/versionCode $N/; s/versionName \"1.0\"/versionName \"1.$N\"/" app/build.gradle

      - name: Costruisci l'APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../CarburanteGiusto.apk
          ls -la ../../CarburanteGiusto.apk

      - name: Pubblica nella pagina Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-android >/dev/null 2>&1 || gh release create app-android --title "Carburante Giusto per Android" --notes "Scarica CarburanteGiusto.apk dal telefono e aprilo per installarlo. I prezzi si aggiornano da soli ogni giorno." --latest
          gh release upload app-android CarburanteGiusto.apk --clobber
          gh release edit app-android --notes "Scarica CarburanteGiusto.apk dal telefono e aprilo per installarlo (versione 1.${{ github.run_number }}). I prezzi si aggiornano da soli ogni giorno, non serve riscaricare l'app." --latest
