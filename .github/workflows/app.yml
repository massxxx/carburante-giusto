name: App per telefono (Android e iPhone)

# Costruisce le app dai file del sito e le mette nella pagina Releases (tag "app"):
#   Android: https://github.com/massxxx/carburante-giusto/releases/latest/download/CarburanteGiusto.apk
#   iPhone:  https://github.com/massxxx/carburante-giusto/releases/latest/download/CarburanteGiusto.ipa
# I prezzi le app li scaricano ogni volta dal repository: non serve ricostruirle ogni giorno.
# L'IPA non e' firmato (Apple non permette app fuori dall'App Store senza firma):
# si installa firmandolo con il proprio ID Apple tramite Sideloadly o AltStore.
on:
  push:
    branches: [main]
    paths: ['index.html', 'leaflet.js', 'icone/**', 'base/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app
  cancel-in-progress: true

env:
  CAP: '6.2.0'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Progetto
        run: |
          mkdir -p app/www && cd app
          cp -r ../index.html ../leaflet.js ../manifest.webmanifest ../icone ../base ../dati www/
          echo '{"name":"carburante-giusto","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"it.massxxx.carburantegiusto","appName":"Carburante Giusto","webDir":"www"}' > capacitor.config.json
          npm install --no-audit --no-fund @capacitor/core@$CAP @capacitor/cli@$CAP @capacitor/android@$CAP
          npx cap add android && npx cap sync android
      - name: Permessi, icona, versione
        run: |
          cd app/android
          M=app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' $M
          grep -q ACCESS_FINE_LOCATION $M
          rm -rf app/src/main/res/mipmap-anydpi-v26
          for n in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../../icone/android/$n.png app/src/main/res/mipmap-$n/ic_launcher.png
            cp ../../icone/android/$n.png app/src/main/res/mipmap-$n/ic_launcher_round.png
            rm -f app/src/main/res/mipmap-$n/ic_launcher_foreground.png
          done
          N=${{ github.run_number }}
          sed -i "s/versionCode 1$/versionCode $N/; s/versionName \"1.0\"/versionName \"1.$N\"/" app/build.gradle
      - name: APK
        run: |
          cd app/android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../CarburanteGiusto.apk
      - uses: actions/upload-artifact@v4
        with: {name: apk, path: CarburanteGiusto.apk}

  iphone:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Progetto
        run: |
          mkdir -p app/www && cd app
          cp -r ../index.html ../leaflet.js ../manifest.webmanifest ../icone ../base ../dati www/
          echo '{"name":"carburante-giusto","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"it.massxxx.carburantegiusto","appName":"Carburante Giusto","webDir":"www"}' > capacitor.config.json
          npm install --no-audit --no-fund @capacitor/core@$CAP @capacitor/cli@$CAP @capacitor/ios@$CAP
          npx cap add ios && npx cap sync ios
      - name: Nome, posizione, icona, versione
        run: |
          cd app/ios/App
          P=App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Carburante Giusto" $P
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string La posizione serve a trovare i distributori vicino a te." $P
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.${{ github.run_number }}" $P || true
          cp ../../../icone/ios-1024.png App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: IPA (senza firma)
        run: |
          cd app/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -20
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../../CarburanteGiusto.ipa Payload
          ls -la ../../../CarburanteGiusto.ipa
      - uses: actions/upload-artifact@v4
        with: {name: ipa, path: CarburanteGiusto.ipa}

  rilascio:
    needs: [android, iphone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: file, merge-multiple: true}
      - name: Pubblica in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="Versione 1.${{ github.run_number }}.

          - Android: scarica CarburanteGiusto.apk dal telefono e aprilo per installarlo.
          - iPhone: CarburanteGiusto.ipa non e' firmato; si installa con Sideloadly (da PC/Mac) o AltStore usando il proprio ID Apple. In alternativa usa il sito e Aggiungi alla schermata Home.

          I prezzi si aggiornano da soli ogni giorno: non serve riscaricare l'app."
          gh release view app >/dev/null 2>&1 || gh release create app --title "Carburante Giusto per telefono" --notes "$N" --latest
          gh release upload app file/CarburanteGiusto.apk file/CarburanteGiusto.ipa --clobber
          gh release edit app --notes "$N" --latest
